name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-py:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install 'ruff==0.15.10'
      - run: ruff check scripts/

  lint-site:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint

  public-script-tests:
    name: Data-pipeline tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest
      - run: pytest scripts/tests -q

  schema-check:
    name: Schema check (drizzle-kit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate public schemas, fields, paths, and API manifest
        run: python scripts/ci/verify-public-boundary.py

  rubric-tests:
    name: Rubric tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site

  rubric-version-pin:
    name: Rubric version pin (constant = DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify rubric pins in committed public API
        run: python scripts/ci/verify-public-boundary.py

  type-check:
    name: Type-check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site

  source-invariant:
    name: Source citation invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reject private evidence and non-published assessment references
        run: python scripts/ci/verify-public-boundary.py

  changelog-check:
    name: Changelog append-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure the public methodology changelog is append-only
        run: |
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          removed=$(git diff "$base"...HEAD -- docs/methodology/changelog.md | grep '^-[^-]' | wc -l)
          if [ "$removed" -gt 0 ]; then
            echo "FAIL: methodology changelog entries cannot be removed or modified"
            exit 1
          fi

  openapi-check:
    name: OpenAPI spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate OpenAPI artifacts
        run: |
          set -euo pipefail
          jq -e '.openapi == "3.1.0"' site/public/openapi.json
          jq -e '.openapi == "3.1.0"' data/api/v1.7.0/openapi.json
          cmp site/public/openapi.json data/api/v1.7.0/openapi.json
          node scripts/generate-openapi-yaml.mjs
          git diff --exit-code -- site/public/openapi.yaml data/api/v1.7.0/openapi.yaml

  astro-build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site

  public-export-boundary:
    name: Published API surface boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: node scripts/ci/check-public-export-boundary.mjs
      - run: python scripts/ci/verify-public-boundary.py

  a11y-check:
    name: Accessibility check (axe-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: python scripts/ci/build-family-api-fixture.py
      - run: npm run build
        working-directory: site
        env:
          DEFIRISK_API_ROOT: ${{ github.workspace }}/_local/family-api-fixture/v1.7.0
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:a11y
        working-directory: site

  perf-budget:
    name: Performance budget (JS bundle sizes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: node scripts/ci/check-perf-budget.mjs

  smoke-staging:
    name: Smoke tests (local preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: python scripts/ci/build-family-api-fixture.py
      - run: npm run build
        working-directory: site
        env:
          DEFIRISK_API_ROOT: ${{ github.workspace }}/_local/family-api-fixture/v1.7.0
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:smoke
        working-directory: site

  migration-roundtrip:
    name: Migration round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest
      - name: Exercise boundary failure fixtures
        run: pytest scripts/tests/test_public_boundary_architecture.py -q

  migration-replay:
    name: Migration replay (ordered SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify deterministic committed API replay
        run: |
          python scripts/ci/build-public-api-manifest.py --check
          python scripts/ci/verify-public-boundary.py
