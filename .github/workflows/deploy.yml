name: Deploy to VPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml', 'scripts/ci/deploy-vps-safe.sh', 'site/**', 'scripts/**', 'db/migrations/**']
  workflow_dispatch:
    inputs:
      reason: {description: 'Reason for manual deploy', required: false, default: 'force rebuild'}
concurrency: {group: deploy-vps, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - name: Stage, validate, and atomically promote via SSH
        env: {VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_SSH_KEY: '${{ secrets.VPS_SSH_KEY }}'}
        run: |
          (umask 177; echo "$VPS_SSH_KEY" > /tmp/deploy_key)
          trap 'rm -f /tmp/deploy_key' EXIT
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOpn9P0m/4sJCsgGPubzi78FvRs9Q82TtcI022O4lgwe" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 rdapp@"$VPS_HOST" 'bash -s -- /opt/riskdashboard origin main' < scripts/ci/deploy-vps-safe.sh
      - name: Smoke check
        run: test "$(curl -o /dev/null -s -w '%{http_code}' https://defirisk.co/)" = 200
