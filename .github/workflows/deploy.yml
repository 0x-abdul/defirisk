# SSH-based deploy to Hetzner VPS.
#
# Triggers on pushes to main that touch site/ or scripts/ (code changes).
# Data-only pushes (data/api/ from the nightly pipeline) do NOT trigger this
# workflow — the nightly script rebuilds the site on the VPS directly after
# running compose.py + dump.py, which is faster and avoids unnecessary
# GitHub Actions minutes.
#
# Prerequisites — configure in repo Settings → Secrets → Actions:
#   VPS_HOST       IPv4 address of the Hetzner CX32 VPS
#   VPS_SSH_KEY    Private key for the github-actions-deploy key
#                  (add the corresponding public key to rdapp@vps:~/.ssh/authorized_keys)
#
# Manual dispatch: Actions UI → Deploy to VPS → Run workflow
# Force rebuild without a code change: use workflow_dispatch below.

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/compose.py'
      - 'scripts/detect-grade-changes.py'
      - 'scripts/dump.py'
      - 'scripts/prune-history.py'
      - 'scripts/refresh-continuous.py'
      - 'scripts/rubric.py'
      - 'db/migrations/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'force rebuild'

# Serialize deploys. Two PRs merged seconds apart would otherwise run parallel
# SSH deploys that both `npm ci` into the same VPS dir and clobber each other's
# node_modules (build then fails with "astro: not found"). cancel-in-progress is
# false so a queued deploy waits for the running one to finish rather than
# cancelling it — every merged change still gets deployed, just one at a time.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          (umask 177; echo "$VPS_SSH_KEY" > /tmp/deploy_key)
          trap 'rm -f /tmp/deploy_key' EXIT
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOpn9P0m/4sJCsgGPubzi78FvRs9Q82TtcI022O4lgwe" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              rdapp@"$VPS_HOST" << 'REMOTE'
            set -euo pipefail
            cd /opt/riskdashboard

            echo "==> Pulling latest code..."
            # --no-rebase (merge) is required: the VPS carries local nightly
            # data commits (data/api/) that diverge from origin/main, so a bare
            # `git pull` errors with "Need to specify how to reconcile divergent
            # branches". Merge lets the local data commits coexist with incoming
            # code; --ff-only was removed earlier for the same reason (a187fce5).
            # The merge needs a committer identity; the rdapp user has none
            # configured, so set a repo-local one (idempotent) before pulling.
            git config user.email "deploy@defirisk.co"
            git config user.name "RiskDashboard Deploy"

            # History-rewrite guard: normally we merge-pull (above). But if main's
            # history was rewritten upstream (e.g. a force-push to strip commit
            # trailers), the previous origin tip is no longer an ancestor of the
            # new one, and a merge would create a tangled commit or hard conflict
            # (the divergent-branch failure from #11/#15). Detect that and instead
            # hard-reset to origin/main. The local data commits dropped here are
            # regenerated on the next nightly run, so this is safe.
            prev_remote=$(git rev-parse origin/main)
            git fetch origin main
            if git merge-base --is-ancestor "$prev_remote" origin/main; then
              git pull --no-rebase origin main
            else
              echo "==> origin/main was rewritten upstream; hard-resetting (data regenerates nightly)"
              git reset --hard origin/main
            fi

            echo "==> Rebuilding site..."
            cd site
            # Keep each build step on its own line: under `set -e` a failing
            # command in an `&&` list does NOT abort the script, so chaining
            # `npm ci && npm run build` let a broken build report success and
            # serve a stale site. Separate statements fail loudly.
            #
            # Redirect npm's cache to a repo-local dir rdapp owns: the default
            # ~/.npm contains root-owned files from an earlier root install,
            # which makes `npm ci` fail with EACCES.
            export npm_config_cache="/opt/riskdashboard/.npm-cache"
            npm ci --prefer-offline
            npm run build
            cd ..

            echo "==> Deploy complete at $(date -u +%Y-%m-%dT%H:%MZ)"
          REMOTE

      - name: Smoke check
        if: success()
        run: |
          sleep 5   # brief settle time after Nginx picks up new files
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            https://defirisk.co/)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Smoke check passed: HTTP $STATUS"
