name: Protocol refresh foundation

on:
  pull_request:
    paths:
      - 'db/migrations/0009_protocol_last_refreshed.sql'
      - 'db/migrations/0010_protocol_refresh_idempotency.sql'
      - 'db/migrations/0012_runtime_role_grants.sql'
      - 'db/migrations/0013_schema_migration_ledger.sql'
      - 'db/runtime-role-policy.json'
      - 'docs/ops/protocol-refresh/**'
      - 'scripts/protocol_refresh_apply/**'
      - 'scripts/protocol_refresh_public/**'
      - 'scripts/apply-protocol-refresh.py'
      - 'scripts/dump.py'
      - 'scripts/export-protocol-refresh.py'
      - 'scripts/manage-refresh-migrations.py'
      - 'scripts/protocol_refresh_migrations.py'
      - 'scripts/verify-protocol-output.py'
      - 'scripts/verify-protocol-refresh-public.py'
      - 'scripts/verify-runtime-grant-policy.py'
      - 'scripts/tests/test_protocol_refresh_*.py'
      - 'scripts/tests/test_dump_surfaces.py'
      - 'scripts/ci/check-public-export-boundary.mjs'
      - '.github/ISSUE_TEMPLATE/protocol-data-refresh.md'
      - '.github/workflows/protocol-refresh-foundation.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Refresh contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest ruff 'psycopg[binary]>=3.1'
      - name: Lint refresh tooling
        run: |
          ruff check scripts/protocol_refresh_apply scripts/protocol_refresh_public
          ruff check scripts/apply-protocol-refresh.py scripts/export-protocol-refresh.py
          ruff check scripts/manage-refresh-migrations.py scripts/protocol_refresh_migrations.py
          ruff check scripts/dump.py scripts/tests/test_dump_surfaces.py
          ruff check scripts/verify-protocol-output.py scripts/verify-protocol-refresh-public.py scripts/verify-runtime-grant-policy.py
          ruff check scripts/tests/test_protocol_refresh_*.py scripts/tests/test_runtime_grant_policy.py
      - name: Run refresh tests
        run: |
          pytest scripts/tests -q -k 'protocol_refresh or runtime_grant'
          pytest scripts/tests/test_dump_surfaces.py -q
      - name: Verify non-mutating foundation
        run: python scripts/verify-protocol-refresh-public.py --foundation-only

  migrations:
    name: Refresh migration replay and grants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risk_dashboard
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DSN: postgresql://postgres:postgres@localhost:5432/risk_dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime verification dependencies
        run: pip install 'psycopg[binary]>=3.1'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Create disposable runtime role
        run: psql "$DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE rdapp LOGIN;"
      - name: Replay ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(db/migrations/[0-9]*.sql)
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          unset IFS
          for file in "${files[@]}"; do
            if [ "$(basename "$file")" = "0008_protocol_surfaces.sql" ]; then
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/family-pre-0008-fixture.sql
              psql "$DSN" -v ON_ERROR_STOP=1 -f "$file"
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/assert-family-backfill.sql
              psql "$DSN" -v ON_ERROR_STOP=1 -f "$file"
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/assert-family-backfill.sql
            else
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction -f "$file"
            fi
          done
      - name: Prove refresh migrations are replay-safe
        shell: bash
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -c "UPDATE protocols SET last_refreshed = DATE '2026-07-11' WHERE slug = 'fixture-family';"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0009_protocol_last_refreshed.sql
          test "$(psql "$DSN" -Atc "SELECT last_refreshed FROM protocols WHERE slug='fixture-family';")" = "2026-07-11"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0010_protocol_refresh_idempotency.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0012_runtime_role_grants.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('apply-protocol-refresh.py', 'protocol-refresh:fixture');"
          if psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('apply-protocol-refresh.py', 'protocol-refresh:fixture');"; then
            echo "duplicate refresh reservation unexpectedly succeeded"
            exit 1
          fi
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('compose.py', 'protocol-refresh:fixture');"
      - name: Verify refresh schema and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='protocols' AND column_name='last_refreshed';")" = "1"
          test "$(psql "$DSN" -Atc "SELECT to_regclass('public.pipeline_runs_protocol_refresh_trigger_unique') IS NOT NULL;")" = "t"
          for table in protocol_families protocol_surfaces; do
            privileges="$(psql "$DSN" -Atc "SELECT string_agg(privilege_type, ',' ORDER BY privilege_type) FROM information_schema.role_table_grants WHERE grantee='rdapp' AND table_schema='public' AND table_name='${table}';")"
            test "$privileges" = "SELECT"
          done
          python scripts/verify-runtime-grant-policy.py --db-url "$DSN"
          visible="$(psql "$DSN" -qAt -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; SELECT (SELECT count(*) FROM protocol_families) || '|' || (SELECT count(*) FROM protocol_surfaces);")"
          IFS='|' read -r family_count surface_count <<< "$visible"
          test "$family_count" -gt 0
          test "$surface_count" -gt 0
          if psql "$DSN" -q -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; UPDATE protocol_surfaces SET updated_at = updated_at WHERE family_slug = 'fixture-family';"; then
            echo "rdapp unexpectedly updated a protocol surface"
            exit 1
          fi
      - name: Exercise receipt-gated migration runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _local/refresh-migration-test
          migration_sha="$(sha256sum db/migrations/0009_protocol_last_refreshed.sql | awk '{print $1}')"
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (filename, sha256, applied_at, applied_by, authorization_id) VALUES ('0009_protocol_last_refreshed.sql', '${migration_sha}', TIMESTAMPTZ '2026-07-11T00:00:00Z', 'prior-operator', 'prior-window');"
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            --plan-out _local/refresh-migration-test/plan.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("_local/refresh-migration-test")
          plan = json.loads((root / "plan.json").read_text())
          backup_path = root / "ci-backup.dump"
          backup_path.write_bytes(b"disposable CI backup fixture\n")
          backup = {
              "schema_version": "1.0",
              "receipt_type": "database_backup_receipt",
              "operation": "apply_refresh_migrations",
              "plan_sha256": plan["plan_sha256"],
              "backup_id": "ci-disposable-restore",
              "backup_path": backup_path.name,
              "sha256": hashlib.sha256(backup_path.read_bytes()).hexdigest(),
              "size_bytes": backup_path.stat().st_size,
              "created_at": "2026-07-11T00:00:00Z",
              "database_identity": plan["database_identity"],
              "restore_command": "restore-ci-disposable-postgres",
              "restore_test": {
                  "status": "passed",
                  "tested_at": "2026-07-11T00:01:00Z",
                  "evidence": "ordered migration replay completed",
              },
          }
          authorization = {
              "schema_version": "1.0",
              "receipt_type": "refresh_migration_authorization",
              "authorization_id": "ci-refresh-migrations",
              "operation": "apply_refresh_migrations",
              "database_identity": plan["database_identity"],
              "plan_sha256": plan["plan_sha256"],
              "allowed_migrations": plan["pending_migrations"],
              "authorized_by": "ci",
              "authorized_at": "2026-07-11T00:02:00Z",
          }
          (root / "backup.json").write_text(json.dumps(backup))
          (root / "authorization.json").write_text(json.dumps(authorization))
          PY
          python scripts/manage-refresh-migrations.py \
            --apply --db-url "$DSN" --expected-database risk_dashboard \
            --backup-receipt _local/refresh-migration-test/backup.json \
            --authorization _local/refresh-migration-test/authorization.json \
            --receipt-out _local/refresh-migration-test/receipt.json
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/after-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("_local/refresh-migration-test/after-plan.json").read_text())
          assert plan["pending_migrations"] == [], plan
          PY
          test "$(psql "$DSN" -Atc "SELECT applied_at = TIMESTAMPTZ '2026-07-11T00:00:00Z' AND applied_by = 'prior-operator' AND authorization_id = 'prior-window' FROM schema_migrations WHERE filename = '0009_protocol_last_refreshed.sql';")" = "t"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM schema_migrations WHERE authorization_id = 'ci-refresh-migrations';")" = "3"
