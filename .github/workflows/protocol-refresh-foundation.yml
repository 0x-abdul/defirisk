name: Protocol refresh foundation

on:
  pull_request:
    paths:
      - 'db/migrations/0009_protocol_last_refreshed.sql'
      - 'db/migrations/0010_protocol_refresh_idempotency.sql'
      - 'db/migrations/0012_runtime_role_grants.sql'
      - 'db/migrations/0013_schema_migration_ledger.sql'
      - 'db/migrations/0014_nightly_ingest_topology_functions.sql'
      - 'db/runtime-role-policy.json'
      - 'docs/ops/protocol-refresh/**'
      - 'scripts/lean_protocol_refresh/**'
      - 'scripts/protocol_refresh_apply/**'
      - 'scripts/protocol_refresh_public/**'
      - 'scripts/apply-lean-protocol-refresh.py'
      - 'scripts/dump.py'
      - 'scripts/compose.py'
      - 'scripts/detect-grade-changes.py'
      - 'scripts/refresh-continuous.py'
      - 'scripts/manage-refresh-migrations.py'
      - 'scripts/protocol_refresh_migrations.py'
      - 'scripts/verify-protocol-output.py'
      - 'scripts/verify-runtime-grant-policy.py'
      - 'scripts/tests/test_lean_*.py'
      - 'scripts/tests/test_protocol_refresh_*.py'
      - 'scripts/tests/test_nightly_ingest_postgres.py'
      - 'scripts/tests/test_compose_surfaces.py'
      - 'scripts/tests/test_detect_grade_changes.py'
      - 'scripts/tests/test_refresh_continuous.py'
      - 'scripts/tests/test_dump_surfaces.py'
      - 'scripts/ci/check-public-export-boundary.mjs'
      - '.github/ISSUE_TEMPLATE/protocol-data-refresh.md'
      - '.github/workflows/protocol-refresh-foundation.yml'
      - '.github/workflows/ingest.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Refresh contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest ruff 'psycopg[binary]>=3.1'
      - name: Lint refresh tooling
        run: |
          ruff check scripts/protocol_refresh_apply scripts/protocol_refresh_public
          ruff check scripts/lean_protocol_refresh scripts/apply-lean-protocol-refresh.py
          ruff check scripts/manage-refresh-migrations.py scripts/protocol_refresh_migrations.py
          ruff check scripts/dump.py scripts/tests/test_dump_surfaces.py
          ruff check scripts/compose.py scripts/detect-grade-changes.py scripts/refresh-continuous.py
          ruff check scripts/verify-protocol-output.py scripts/verify-runtime-grant-policy.py
          ruff check scripts/tests/test_lean_*.py
          ruff check scripts/tests/test_protocol_refresh_*.py scripts/tests/test_runtime_grant_policy.py
          ruff check scripts/tests/test_nightly_ingest_postgres.py
      - name: Run refresh tests
        run: |
          pytest scripts/tests -q -k 'lean or protocol_refresh or runtime_grant'
          pytest scripts/tests/test_dump_surfaces.py -q
          pytest scripts/tests/test_compose_surfaces.py scripts/tests/test_detect_grade_changes.py scripts/tests/test_refresh_continuous.py -q
      - name: Verify non-mutating foundation
        run: python scripts/apply-lean-protocol-refresh.py --help

  migrations:
    name: Refresh migration replay and grants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: risk_dashboard
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DSN: postgresql://postgres:postgres@localhost:5432/risk_dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install runtime verification dependencies
        run: pip install pytest 'psycopg[binary]>=3.1'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Create disposable runtime role
        run: psql "$DSN" -v ON_ERROR_STOP=1 -c "CREATE ROLE rdapp LOGIN PASSWORD 'rdapp';"
      - name: Replay ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(db/migrations/[0-9]*.sql)
          IFS=$'\n' files=($(printf '%s\n' "${files[@]}" | sort))
          unset IFS
          for file in "${files[@]}"; do
            if [ "$(basename "$file")" = "0014_nightly_ingest_topology_functions.sql" ]; then
              python scripts/manage-refresh-migrations.py \
                --plan --db-url "$DSN" --expected-database risk_dashboard \
                > /tmp/pre-0014-plan.json
              python -c "import json; assert '0014_nightly_ingest_topology_functions.sql' in json.load(open('/tmp/pre-0014-plan.json'))['pending_migrations']"
            fi
            if [ "$(basename "$file")" = "0008_protocol_surfaces.sql" ]; then
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/family-pre-0008-fixture.sql
              psql "$DSN" -v ON_ERROR_STOP=1 -f "$file"
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/assert-family-backfill.sql
              psql "$DSN" -v ON_ERROR_STOP=1 -f "$file"
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction \
                -f scripts/ci/assert-family-backfill.sql
            else
              psql "$DSN" -v ON_ERROR_STOP=1 --single-transaction -f "$file"
            fi
          done
      - name: Prove refresh migrations are replay-safe
        shell: bash
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -c "UPDATE protocols SET last_refreshed = DATE '2026-07-11' WHERE slug = 'fixture-family';"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0009_protocol_last_refreshed.sql
          test "$(psql "$DSN" -Atc "SELECT last_refreshed FROM protocols WHERE slug='fixture-family';")" = "2026-07-11"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0010_protocol_refresh_idempotency.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0012_runtime_role_grants.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0014_nightly_ingest_topology_functions.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('apply-protocol-refresh.py', 'protocol-refresh:fixture');"
          if psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('apply-protocol-refresh.py', 'protocol-refresh:fixture');"; then
            echo "duplicate refresh reservation unexpectedly succeeded"
            exit 1
          fi
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO pipeline_runs (script_name, triggered_by) VALUES ('compose.py', 'protocol-refresh:fixture');"
      - name: Verify refresh schema and runtime grants
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='protocols' AND column_name='last_refreshed';")" = "1"
          test "$(psql "$DSN" -Atc "SELECT to_regclass('public.pipeline_runs_protocol_refresh_trigger_unique') IS NOT NULL;")" = "t"
          for table in protocol_families protocol_surfaces; do
            privileges="$(psql "$DSN" -Atc "SELECT string_agg(privilege_type, ',' ORDER BY privilege_type) FROM information_schema.role_table_grants WHERE grantee='rdapp' AND table_schema='public' AND table_name='${table}';")"
            test "$privileges" = "SELECT"
          done
          python scripts/verify-runtime-grant-policy.py --db-url "$DSN"
          visible="$(psql "$DSN" -qAt -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; SELECT (SELECT count(*) FROM protocol_families) || '|' || (SELECT count(*) FROM protocol_surfaces);")"
          IFS='|' read -r family_count surface_count <<< "$visible"
          test "$family_count" -gt 0
          test "$surface_count" -gt 0
          for table in protocol_families protocol_surfaces; do
            if psql "$DSN" -q -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; UPDATE ${table} SET updated_at = updated_at WHERE false;"; then
              echo "rdapp unexpectedly updated ${table}"
              exit 1
            fi
          done
          psql "$DSN" -q -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; SELECT refresh_sync_family_tvl('fixture-family', 123.45);"
          test "$(psql "$DSN" -Atc "SELECT total_value_secured_usd FROM protocol_families WHERE family_slug='fixture-family';")" = "123.45"
          test "$(psql "$DSN" -Atc "SELECT tvs_usd FROM protocol_surfaces WHERE family_slug='fixture-family' AND is_primary;")" = "123.45"
          primary_surface="$(psql "$DSN" -Atc "SELECT primary_surface_id FROM protocol_families WHERE family_slug='fixture-family';")"
          rubric_version="$(psql "$DSN" -Atc "SELECT version FROM rubric_versions WHERE is_active=true ORDER BY version LIMIT 1;")"
          psql "$DSN" -q -v ON_ERROR_STOP=1 -c "SET ROLE rdapp; SELECT refresh_update_surface_grade('fixture-family', '${primary_surface}', 'B', '${rubric_version}', now(), 25.5, '{\"1\": 25.5}'::jsonb, NULL, NULL);"
          test "$(psql "$DSN" -Atc "SELECT headline_grade FROM protocol_surfaces WHERE surface_id='${primary_surface}';")" = "B"
          test "$(psql "$DSN" -Atc "SELECT headline_grade FROM protocol_families WHERE family_slug='fixture-family';")" = "B"
          if psql "$DSN" -q -v ON_ERROR_STOP=1 -c "BEGIN; SET ROLE rdapp; SELECT refresh_sync_family_tvl('fixture-family', 999.00); SELECT refresh_update_surface_grade('fixture-family', '00000000-0000-0000-0000-000000000000', 'A', '${rubric_version}', now(), 1, '{}'::jsonb, NULL, NULL); COMMIT;"; then
            echo "mismatched surface linkage unexpectedly succeeded"
            exit 1
          fi
          test "$(psql "$DSN" -Atc "SELECT total_value_secured_usd FROM protocol_families WHERE family_slug='fixture-family';")" = "123.45"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_proc WHERE oid IN ('public.refresh_sync_family_tvl(text,numeric)'::regprocedure, 'public.refresh_update_surface_grade(text,uuid,text,text,timestamp with time zone,numeric,jsonb,text,text)'::regprocedure) AND prosecdef AND proconfig @> ARRAY['search_path=pg_catalog'] AND pg_get_userbyid(proowner) = 'rdapp_nightly_owner';")" = "2"
          test "$(psql "$DSN" -Atc "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolcanlogin AND NOT rolreplication AND NOT rolinherit AND NOT rolbypassrls FROM pg_roles WHERE rolname='rdapp_nightly_owner';")" = "t"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_auth_members m JOIN pg_roles r ON r.oid IN (m.roleid, m.member) WHERE r.rolname='rdapp_nightly_owner';")" = "0"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_stat_activity a JOIN pg_roles r ON r.oid=a.usesysid WHERE r.rolname='rdapp_nightly_owner';")" = "0"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_shdepend d JOIN pg_roles r ON r.oid=d.refobjid WHERE d.refclassid='pg_authid'::regclass AND r.rolname='rdapp_nightly_owner' AND d.deptype='o' AND NOT (d.dbid=(SELECT oid FROM pg_database WHERE datname=current_database()) AND d.classid='pg_proc'::regclass AND d.objid IN ('public.refresh_sync_family_tvl(text,numeric)'::regprocedure, 'public.refresh_update_surface_grade(text,uuid,text,text,timestamp with time zone,numeric,jsonb,text,text)'::regprocedure));")" = "0"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_roles r ON r.rolname='rdapp_nightly_owner' WHERE n.nspname='public' AND c.relname IN ('protocol_families','protocol_surfaces') AND p.polname='nightly_owner_update' AND p.polcmd='w' AND p.polroles=ARRAY[r.oid] AND pg_get_expr(p.polqual,p.polrelid)='true' AND pg_get_expr(p.polwithcheck,p.polrelid)='true';")" = "2"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_proc p CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl WHERE p.oid IN ('public.refresh_sync_family_tvl(text,numeric)'::regprocedure, 'public.refresh_update_surface_grade(text,uuid,text,text,timestamp with time zone,numeric,jsonb,text,text)'::regprocedure) AND acl.grantee=0 AND acl.privilege_type='EXECUTE';")" = "0"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_proc p CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl WHERE p.oid IN ('public.refresh_sync_family_tvl(text,numeric)'::regprocedure, 'public.refresh_update_surface_grade(text,uuid,text,text,timestamp with time zone,numeric,jsonb,text,text)'::regprocedure) AND acl.privilege_type='EXECUTE' AND acl.grantee NOT IN (p.proowner, (SELECT oid FROM pg_roles WHERE rolname='rdapp'));")" = "0"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM pg_proc p CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) acl WHERE p.oid IN ('public.refresh_sync_family_tvl(text,numeric)'::regprocedure, 'public.refresh_update_surface_grade(text,uuid,text,text,timestamp with time zone,numeric,jsonb,text,text)'::regprocedure) AND acl.privilege_type='EXECUTE' AND acl.grantee=(SELECT oid FROM pg_roles WHERE rolname='rdapp') AND acl.is_grantable;")" = "0"
      - name: Prove nightly rollback under the runtime role
        env:
          TEST_RUNTIME_DATABASE_URL: postgresql://rdapp:rdapp@localhost:5432/risk_dashboard
          TEST_ADMIN_DATABASE_URL: ${{ env.DSN }}
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rdapp; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rdapp;"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0012_runtime_role_grants.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0014_nightly_ingest_topology_functions.sql
          pytest scripts/tests/test_nightly_ingest_postgres.py -q
      - name: Exercise receipt-gated migration runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _local/refresh-migration-test
          migration_sha="$(sha256sum db/migrations/0009_protocol_last_refreshed.sql | awk '{print $1}')"
          psql "$DSN" -v ON_ERROR_STOP=1 -c "INSERT INTO schema_migrations (filename, sha256, applied_at, applied_by, authorization_id) VALUES ('0009_protocol_last_refreshed.sql', '${migration_sha}', TIMESTAMPTZ '2026-07-11T00:00:00Z', 'prior-operator', 'prior-window');"
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            --plan-out _local/refresh-migration-test/plan.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("_local/refresh-migration-test")
          plan = json.loads((root / "plan.json").read_text())
          backup_path = root / "ci-backup.dump"
          backup_path.write_bytes(b"disposable CI backup fixture\n")
          backup = {
              "schema_version": "1.0",
              "receipt_type": "database_backup_receipt",
              "operation": "apply_refresh_migrations",
              "plan_sha256": plan["plan_sha256"],
              "backup_id": "ci-disposable-restore",
              "backup_path": backup_path.name,
              "sha256": hashlib.sha256(backup_path.read_bytes()).hexdigest(),
              "size_bytes": backup_path.stat().st_size,
              "created_at": "2026-07-11T00:00:00Z",
              "database_identity": plan["database_identity"],
              "restore_command": "restore-ci-disposable-postgres",
              "restore_test": {
                  "status": "passed",
                  "tested_at": "2026-07-11T00:01:00Z",
                  "evidence": "ordered migration replay completed",
              },
          }
          authorization = {
              "schema_version": "1.0",
              "receipt_type": "refresh_migration_authorization",
              "authorization_id": "ci-refresh-migrations",
              "operation": "apply_refresh_migrations",
              "database_identity": plan["database_identity"],
              "plan_sha256": plan["plan_sha256"],
              "allowed_migrations": plan["pending_migrations"],
              "authorized_by": "ci",
              "authorized_at": "2026-07-11T00:02:00Z",
          }
          (root / "backup.json").write_text(json.dumps(backup))
          (root / "authorization.json").write_text(json.dumps(authorization))
          PY
          python scripts/manage-refresh-migrations.py \
            --apply --db-url "$DSN" --expected-database risk_dashboard \
            --backup-receipt _local/refresh-migration-test/backup.json \
            --authorization _local/refresh-migration-test/authorization.json \
            --receipt-out _local/refresh-migration-test/receipt.json
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/after-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("_local/refresh-migration-test/after-plan.json").read_text())
          assert plan["pending_migrations"] == [], plan
          PY
          test "$(psql "$DSN" -Atc "SELECT applied_at = TIMESTAMPTZ '2026-07-11T00:00:00Z' AND applied_by = 'prior-operator' AND authorization_id = 'prior-window' FROM schema_migrations WHERE filename = '0009_protocol_last_refreshed.sql';")" = "t"
          test "$(psql "$DSN" -Atc "SELECT count(*) FROM schema_migrations WHERE authorization_id = 'ci-refresh-migrations';")" = "5"
          psql "$DSN" -v ON_ERROR_STOP=1 -c "REVOKE EXECUTE ON FUNCTION public.refresh_sync_family_tvl(text, numeric) FROM rdapp;"
          if python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/drift-plan.json \
            2> _local/refresh-migration-test/drift-error.txt; then
            echo "recorded migration contract drift unexpectedly planned as pending"
            exit 1
          fi
          grep -q "recorded migration contract drift" _local/refresh-migration-test/drift-error.txt
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0014_nightly_ingest_topology_functions.sql
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/repaired-plan.json
          python -c "import json; assert json.load(open('_local/refresh-migration-test/repaired-plan.json'))['pending_migrations'] == []"
          psql "$DSN" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION public.refresh_sync_family_tvl(
            p_family_slug text,
            p_tvl_usd numeric
          )
          RETURNS void
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog
          AS $function$
          BEGIN
            NULL;
          END;
          $function$;
          SQL
          if python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/body-drift-plan.json \
            2> _local/refresh-migration-test/body-drift-error.txt; then
            echo "recorded migration function-body drift unexpectedly planned as pending"
            exit 1
          fi
          grep -q "recorded migration contract drift" _local/refresh-migration-test/body-drift-error.txt
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0014_nightly_ingest_topology_functions.sql
          python scripts/manage-refresh-migrations.py \
            --plan --db-url "$DSN" --expected-database risk_dashboard \
            > _local/refresh-migration-test/body-repaired-plan.json
          python -c "import json; assert json.load(open('_local/refresh-migration-test/body-repaired-plan.json'))['pending_migrations'] == []"
          psql "$DSN" -v ON_ERROR_STOP=1 -c "ALTER ROLE rdapp_nightly_owner LOGIN;"
          if psql "$DSN" -v ON_ERROR_STOP=1 \
            -f db/migrations/0014_nightly_ingest_topology_functions.sql; then
            echo "migration unexpectedly adopted a LOGIN function owner"
            exit 1
          fi
          psql "$DSN" -v ON_ERROR_STOP=1 -c "ALTER ROLE rdapp_nightly_owner NOLOGIN PASSWORD NULL;"
          psql "$DSN" -v ON_ERROR_STOP=1 -f db/migrations/0014_nightly_ingest_topology_functions.sql
