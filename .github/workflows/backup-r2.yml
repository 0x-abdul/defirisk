# Weekly Postgres backup to Cloudflare R2 - E-25
#
# Runs every Sunday at 04:00 UTC.
# Also runnable manually via GitHub UI or: gh workflow run backup-r2.yml
#
# The script:
# - runs pg_dump --format=custom --no-owner --no-acl
# - encrypts the dump to BACKUP_GPG_RECIPIENT
# - uploads to R2 at db/<YYYY-MM-DD>-<weekday>.sql.gpg
# - prunes weekly objects older than --retention-weeks
# - writes monthly copies on the first day of each month

name: Backup DB to R2

on:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup:
    name: pg_dump -> encrypt -> R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check prerequisites
        id: prereq
        run: |
          missing=""
          [ -z "$DB_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$R2_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ENDPOINT" ] && missing="$missing R2_ENDPOINT"
          [ -z "$GPG_RECIPIENT" ] && missing="$missing BACKUP_GPG_RECIPIENT"
          if [ -n "$missing" ]; then
            echo "SKIP: missing secrets:$missing"
            echo "Configure these secrets at production cutover; skipping backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          R2_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          GPG_RECIPIENT: ${{ secrets.BACKUP_GPG_RECIPIENT }}

      - name: Install postgresql-client and gnupg
        if: steps.prereq.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client gnupg

      - name: Set up Python 3.12
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.prereq.outputs.skip != 'true'
        run: pip install --quiet boto3

      - name: Import GPG public key
        if: steps.prereq.outputs.skip != 'true'
        env:
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$BACKUP_GPG_PUBLIC_KEY" ]; then
            echo "WARNING: BACKUP_GPG_PUBLIC_KEY secret not set."
            echo "The backup script will use the runner keyring as-is."
          else
            echo "$BACKUP_GPG_PUBLIC_KEY" | base64 -d | gpg --import
            echo "GPG public key imported."
          fi

      - name: Run backup-to-r2.py
        id: run_backup
        if: steps.prereq.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BACKUP_GPG_RECIPIENT: ${{ secrets.BACKUP_GPG_RECIPIENT }}
        run: |
          python scripts/backup-to-r2.py --retention-weeks 8

      - name: Skip notice
        if: steps.prereq.outputs.skip == 'true'
        run: |
          echo "Backup skipped because required production secrets are not configured."

  notify-on-failure:
    name: Open failure issue
    runs-on: ubuntu-latest
    needs: backup
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Open GitHub Issue for backup failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[incident:backup-failed] Weekly DB backup to R2 failed $(date -u +%Y-%m-%d)"
          BODY="## Backup failure detected

          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow run:** $RUN_URL
          **Trigger:** ${{ github.event_name }}

          ## What failed
          The weekly \`backup-to-r2.py\` run did not complete successfully.
          Check the workflow log above for the specific error.

          ## Immediate actions
          1. Visit the run log: $RUN_URL
          2. If \`pg_dump\` failed: check that \`DATABASE_URL\` is still valid.
          3. If GPG encryption failed: verify \`BACKUP_GPG_RECIPIENT\` and \`BACKUP_GPG_PUBLIC_KEY\` secrets.
          4. If R2 upload failed: check \`R2_ACCESS_KEY_ID\`, \`R2_SECRET_ACCESS_KEY\`, \`R2_ENDPOINT\`, \`R2_BUCKET\`.
          5. Trigger a manual re-run: \`gh workflow run backup-r2.yml\`

          Close this issue once a backup is confirmed healthy."

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "incident:backup-failed" || \
          echo "WARNING: could not create issue; verify the incident:backup-failed label exists."
