# Weekly Postgres backup to Cloudflare R2 — E-25
#
# Runs every Sunday at 04:00 UTC (after Saturday's last ingest cron).
# Also runnable manually via GitHub UI or: gh workflow run backup-r2.yml
#
# What this does
# ──────────────
# 1. Installs postgresql-client + gpg + boto3
# 2. Runs risk-dashboard/scripts/backup-to-r2.py which:
#    - pg_dump --format=custom --no-owner --no-acl → temp file
#    - gpg --encrypt to BACKUP_GPG_RECIPIENT's public key
#    - boto3 upload to R2 at db/<YYYY-MM-DD>-<weekday>.sql.gpg
#    - Prunes weekly objects older than --retention-weeks (default 8)
#    - Monthly copies (1st of month) go to db/monthly/<YYYY-MM>.sql.gpg (never pruned)
#
# Prerequisites — configure in repo Settings → Secrets and variables → Actions:
#   DATABASE_URL          Supabase pooler connection string (set at M5 cutover)
#   R2_ACCESS_KEY_ID      Cloudflare R2 API token access key ID
#   R2_SECRET_ACCESS_KEY  Cloudflare R2 API token secret access key
#   R2_BUCKET             Bucket name (default: riskdashboard-backups)
#   R2_ENDPOINT           https://<account-id>.r2.cloudflarestorage.com
#   BACKUP_GPG_RECIPIENT  GPG key fingerprint or email to encrypt to
#   BACKUP_GPG_PUBLIC_KEY Base64-encoded GPG public key block (gpg --export | base64 -w0)
#
# [!] Pre-M5: DATABASE_URL is not configured — the script exits with a clear
#     skip notice. The workflow still runs to confirm the skip; no error is emitted.
#     Configure all secrets at M5 Supabase cutover.
#
# On failure: this workflow opens a GitHub Issue tagged incident:backup-failed
# so the solo builder is notified even without active monitoring.

name: Backup DB to R2

on:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 04:00 UTC
  workflow_dispatch:        # manual: gh workflow run backup-r2.yml

permissions:
  contents: read
  issues: write             # needed for failure-notification step

jobs:
  backup:
    name: pg_dump → encrypt → R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 0. Checkout (needed for script path) ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Check prerequisites ────────────────────────────────────────────
      - name: Check prerequisites
        id: prereq
        run: |
          missing=""
          [ -z "$DB_URL" ]       && missing="$missing DATABASE_URL"
          [ -z "$R2_ID" ]        && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_KEY" ]       && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ENDPOINT" ]  && missing="$missing R2_ENDPOINT"
          [ -z "$GPG_RECIPIENT" ] && missing="$missing BACKUP_GPG_RECIPIENT"
          if [ -n "$missing" ]; then
            echo "SKIP: missing secrets:$missing"
            echo "Configure these secrets at M5 Supabase cutover — skipping for now."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          DB_URL:        ${{ secrets.DATABASE_URL }}
          R2_ID:         ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_KEY:        ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:   ${{ secrets.R2_ENDPOINT }}
          GPG_RECIPIENT: ${{ secrets.BACKUP_GPG_RECIPIENT }}

      # ── 2. Install system deps ─────────────────────────────────────────────
      - name: Install postgresql-client and gnupg
        if: steps.prereq.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client gnupg

      # ── 3. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.12
        if: steps.prereq.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ── 4. Install Python deps ────────────────────────────────────────────
      - name: Install Python dependencies
        if: steps.prereq.outputs.skip != 'true'
        run: pip install --quiet boto3 'psycopg[binary]'

      # ── 5. Import GPG public key ──────────────────────────────────────────
      #
      # The key is stored base64-encoded in the secret so it survives the
      # GH Secrets value sanitiser. Generate it with:
      #   gpg --export <fingerprint> | base64 -w0
      # Then store the output as the BACKUP_GPG_PUBLIC_KEY secret.
      - name: Import GPG public key
        if: steps.prereq.outputs.skip != 'true'
        env:
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$BACKUP_GPG_PUBLIC_KEY" ]; then
            echo "WARNING: BACKUP_GPG_PUBLIC_KEY secret not set."
            echo "The backup script will still attempt encryption using the keyring."
            echo "If BACKUP_GPG_RECIPIENT is not already trusted, the step will fail."
          else
            echo "$BACKUP_GPG_PUBLIC_KEY" | base64 -d | gpg --import
            echo "GPG public key imported."
          fi

      # ── 6. Run backup script ──────────────────────────────────────────────
      - name: Run backup-to-r2.py
        id: run_backup
        if: steps.prereq.outputs.skip != 'true'
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
          BACKUP_GPG_RECIPIENT:  ${{ secrets.BACKUP_GPG_RECIPIENT }}
        run: |
          python risk-dashboard/scripts/backup-to-r2.py --retention-weeks 8

      # ── 7. Skip notice (pre-M5) ───────────────────────────────────────────
      - name: Skip notice (pre-M5)
        if: steps.prereq.outputs.skip == 'true'
        run: |
          echo "Backup skipped — secrets not yet configured (pre-M5 Supabase cutover)."
          echo "This is expected until the production Supabase project is provisioned."

  # ── Failure notification ──────────────────────────────────────────────────
  #
  # Opens a GitHub Issue tagged 'incident:backup-failed' if the backup job
  # fails. This gives the solo builder a persistent notification without
  # needing to watch CI emails.
  notify-on-failure:
    name: Open failure issue
    runs-on: ubuntu-latest
    needs: backup
    if: failure()
    permissions:
      issues: write

    steps:
      - name: Open GitHub Issue for backup failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="[incident:backup-failed] Weekly DB backup to R2 failed $(date -u +%Y-%m-%d)"
          BODY="## Backup failure detected

          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow run:** $RUN_URL
          **Trigger:** ${{ github.event_name }}

          ## What failed
          The weekly \`backup-to-r2.py\` run did not complete successfully.
          Check the workflow log above for the specific error.

          ## Immediate actions
          1. Visit the run log: $RUN_URL
          2. If \`pg_dump\` failed: check that \`DATABASE_URL\` is still valid.
          3. If GPG encryption failed: verify \`BACKUP_GPG_RECIPIENT\` and \`BACKUP_GPG_PUBLIC_KEY\` secrets.
          4. If R2 upload failed: check \`R2_ACCESS_KEY_ID\`, \`R2_SECRET_ACCESS_KEY\`, \`R2_ENDPOINT\`, \`R2_BUCKET\`.
          5. Trigger a manual re-run: \`gh workflow run backup-r2.yml\`
          6. If the problem persists, fall back to the git JSON archive (see \`docs/recovery.md\`).

          ## Severity
          - **Moderate** if this is a one-off transient failure (retry resolves it).
          - **High** if this fails 2+ weeks running — the backup window is narrowing.

          _Auto-opened by the \`backup-r2.yml\` workflow. Close this issue once the backup is confirmed healthy._"

          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "incident:backup-failed" || \
          echo "WARNING: could not create issue (label may not exist — create label 'incident:backup-failed' in repo Settings → Labels)"
