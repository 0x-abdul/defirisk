name: Migrate

on:
  push:
    branches: [main]
    paths:
      - 'db/schema.ts'
      - 'db/migrations/**'

permissions:
  contents: read

# Requires manual approval: set a "production" environment in GitHub repo settings
# with a required reviewer before this workflow can run.
jobs:
  migrate:
    name: Apply Drizzle migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Apply pending migrations
        env:
          # DATABASE_URL points to production Postgres (Supabase at M5 cutover).
          # For M0–M4 this workflow is inactive since no GitHub remote exists yet.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not set — production migration skipped (pre-M5)"
            exit 0
          fi
          npm run db:migrate
