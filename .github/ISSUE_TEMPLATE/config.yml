# Issue chooser configuration.
#
# blank_issues_enabled: false forces every new issue through one of the
# structured templates (factual-correction, grade-dispute, rubric-proposal,
# coverage-request), so people land on the right form instead of a blank box.
blank_issues_enabled: false

contact_links:
  - name: Protocol team? Start here
    url: https://defirisk.co/contributions/#corrections
    about: >-
      If you represent a protocol and need to correct or dispute an assessment,
      read the Contributions guide first — it explains which channel to use.

  - name: Read the methodology
    url: https://defirisk.co/methodology/
    about: >-
      Before disputing a grade, check how it is computed. Grades are a
      deterministic function of cited factor scores.

  - name: Report a security or data-integrity issue
    url: https://github.com/0x-abdul/defirisk/blob/main/SECURITY.md
    about: >-
      Falsified data, a page that misrepresents a deployment, or anything
      security-relevant — see SECURITY.md for the private channel.
