openapi: "3.1.0"
info:
  title: "Risk Dashboard Public JSON API"
  version: "v1.5.0"
  description: |
    Read-only static JSON API for the Risk Dashboard.

    Every response is wrapped in the canonical envelope
    (`rubric_version` + `data_as_of` + `generated_at` + `data`).

    All data is licensed under CC BY 4.0. No authentication required.

    Base path: `https://defirisk.co/api/v1.5.0/`
  license:
    name: "CC BY 4.0 (data) / MIT (code)"
    url: "https://creativecommons.org/licenses/by/4.0/"
  contact:
    name: "Risk Dashboard"
    url: "https://defirisk.co/about/"

servers:
  - url: "https://defirisk.co/api/v1.5.0"
    description: "Production CDN (Cloudflare Pages)"

paths:
  /index.json:
    get:
      operationId: listProtocols
      summary: "Protocol list"
      description: >
        Lightweight index of all graded protocols with headline grade and badge.
        For full factor scores use the per-slug endpoint.
      tags:
        - protocols
      responses:
        "200":
          description: "Protocol list envelope"
          headers:
            Cache-Control:
              schema:
                type: string
              example: "public, max-age=3600, stale-while-revalidate=86400"
            Content-Type:
              schema:
                type: string
              example: "application/json"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  protocols:
                    - slug: "aave-v3"
                      display_name: "Aave v3"
                      protocol_type: "lending"
                      primary_chain: "ethereum"
                      headline_grade: "D"
                      headline_badge: "CLEAN"
                      total_value_secured_usd: 14063906193.0
                      graded_at: "2026-04-27T23:28:46Z"
                      rubric_version: "v1.5.0"
                      status: "live"
                      has_active_incident: true

  /protocols/{slug}.json:
    get:
      operationId: getProtocol
      summary: "Protocol detail"
      description: >
        Full protocol record: deployments, all 184 factor scores with evidence
        summaries, and grade history.
      tags:
        - protocols
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: "Protocol slug, e.g. `aave-v3`"
          example: "aave-v3"
      responses:
        "200":
          description: "Protocol detail envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  protocol_data:
                    protocol:
                      slug: "aave-v3"
                      display_name: "Aave v3"
                      protocol_type: "lending"
                      primary_chain: "ethereum"
                      headline_grade: "D"
                      headline_badge: "CLEAN"
                      total_value_secured_usd: 14063906193.0
                      graded_at: "2026-04-27T23:28:46Z"
                      rubric_version: "v1.5.0"
                      status: "live"
                      has_active_incident: true
                    deployments: []
                    factor_scores: []
                    grade_history: []

  /factors.json:
    get:
      operationId: listFactors
      summary: "Factor encyclopedia"
      description: >
        All 184 factors: id, category, name, description, is_critical,
        curation archetype.
      tags:
        - factors
      responses:
        "200":
          description: "Factor list envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  factors:
                    - id: "RD-F-001"
                      category_id: 1
                      name: "Audit scope mismatch"
                      description: >
                        Check whether the commit SHA cited in the audit report
                        matches the bytecode deployed at the production
                        proxy/implementation address.
                      is_critical: true
                      curation_archetype: "PH"
                      introduced_in_rubric: "v1.5.0"
                      deprecated_in_rubric: null

  /factors/{id}.json:
    get:
      operationId: getFactor
      summary: "Factor detail"
      description: >
        Full per-factor blob: methodology prose, scored_protocols (how every
        protocol in the coverage list scores on this factor), and linked_hacks
        (historical incidents implicating this factor).
      tags:
        - factors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^RD-F-\\d{3}$"
          description: "Factor ID, e.g. `RD-F-001`"
          example: "RD-F-001"
      responses:
        "200":
          description: "Factor detail envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  factor_data:
                    factor:
                      id: "RD-F-001"
                      category_id: 1
                      name: "Audit scope mismatch"
                      is_critical: true
                      scoring_methodology: "..."
                    scored_protocols:
                      - protocol_slug: "aave-v3"
                        score: "green"
                        evidence_summary: "..."
                    linked_hacks:
                      - hack_id: "compound-rekt"
                        relevance: "causal"
                        notes: "..."

  /hacks.json:
    get:
      operationId: listHacks
      summary: "Hack ledger"
      description: >
        All documented DeFi security incidents with root-cause analysis and
        linked risk factors (248 entries at v1.5.0 launch).
      tags:
        - hacks
      responses:
        "200":
          description: "Hack list envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  hacks:
                    - id: "abracadabra-rekt1"
                      protocol_name: "Abracadabra Money (1st incident)"
                      occurred_at: "2024-01-30"
                      loss_usd: 6500000.0
                      category: "CDP / Lending"
                      root_cause: "ERC-4626 rounding error"
                      description: "..."
                      postmortem_url: null
                      funds_recovered_pct: null
                      is_active: false
                      status: "closed"
                      linked_factors:
                        - factor_id: "RD-F-008"
                          relevance: "illustrative"
                          notes: "..."

  /hacks/{id}.json:
    get:
      operationId: getHack
      summary: "Hack detail"
      description: >
        Per-hack blob: full incident record + linked_factors with relevance
        and notes.
      tags:
        - hacks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Hack slug, e.g. `abracadabra-rekt1`"
          example: "abracadabra-rekt1"
      responses:
        "200":
          description: "Hack detail envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  hack_data:
                    hack:
                      id: "abracadabra-rekt1"
                      protocol_name: "Abracadabra Money (1st incident)"
                      occurred_at: "2024-01-30"
                      loss_usd: 6500000.0
                      root_cause: "ERC-4626 rounding error"
                      description: "..."
                    linked_factors:
                      - factor_id: "RD-F-008"
                        relevance: "illustrative"
                        notes: "..."

  /rubric.json:
    get:
      operationId: getRubric
      summary: "Rubric metadata"
      description: >
        Frozen rubric metadata: version, frozen_at, changelog_url, notes.
      tags:
        - metadata
      responses:
        "200":
          description: "Rubric envelope"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              example:
                rubric_version: "v1.5.0"
                data_as_of: "2026-04-28T13:58:51Z"
                generated_at: "2026-04-28T14:03:01Z"
                data:
                  version: "v1.5.0"
                  frozen_at: "2026-04-25T00:00:00Z"
                  changelog_url: "/methodology/changelog#v1-5-0"
                  notes: >
                    Launch rubric. 13 categories, 184 factors, 20 critical,
                    3-value badge layer (PD-033).

  /schemas/envelope.json:
    get:
      operationId: getEnvelopeSchema
      summary: "Envelope JSON Schema"
      description: >
        JSON Schema (Draft 2020-12) for the canonical envelope. Every response
        under /api/v1.5.0/ validates against this.
      tags:
        - metadata
      responses:
        "200":
          description: "JSON Schema document"
          content:
            application/json:
              schema:
                type: object

  /openapi.yaml:
    get:
      operationId: getOpenApiSpecYaml
      summary: "OpenAPI 3.1 spec (YAML)"
      description: "This document in YAML format."
      tags:
        - metadata
      responses:
        "200":
          description: "OpenAPI 3.1 YAML"
          content:
            application/yaml:
              schema:
                type: object

tags:
  - name: protocols
    description: "Protocol risk grades and factor scores"
  - name: factors
    description: "184-factor taxonomy and per-protocol scoring"
  - name: hacks
    description: "Historical DeFi security incidents (248 at v1.5.0)"
  - name: metadata
    description: "Rubric metadata, schemas, and this spec"

components:
  schemas:
    Envelope:
      type: object
      description: >
        Canonical envelope wrapping every response under /api/v1.5.0/.
        Resolves PD-008: rubric_version and data_as_of are mandatory on every
        response so downstream integrators can distinguish grade changes caused
        by new protocol data from those caused by rubric version bumps.
      required:
        - rubric_version
        - data_as_of
        - generated_at
        - data
      additionalProperties: false
      properties:
        rubric_version:
          type: string
          pattern: "^v\\d+\\.\\d+\\.\\d+$"
          description: >
            Frozen rubric version string, e.g. `v1.5.0`. Matches the published
            rubric changelog entry current at grade-computation time.
          example: "v1.5.0"
        data_as_of:
          type: string
          format: date-time
          description: >
            ISO-8601 UTC timestamp of the most recent factor_score collected_at
            across the response payload. May be the Unix epoch (1970-01-01T00:00:00Z)
            when no scores have been collected yet.
          example: "2026-04-28T13:58:51Z"
        generated_at:
          type: string
          format: date-time
          description: "ISO-8601 UTC timestamp of the deterministic reviewed assessment projection."
          example: "2026-04-28T14:03:01Z"
        data:
          type: object
          description: >
            Endpoint-specific payload. Shape documented per-path above.

externalDocs:
  description: "Risk Dashboard methodology and data page"
  url: "https://defirisk.co/data/"
